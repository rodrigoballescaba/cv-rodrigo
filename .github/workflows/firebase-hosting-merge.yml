# Publica public/ en Firebase Hosting al hacer push a main.
# Requiere el secreto FIREBASE_SERVICE_ACCOUNT_CV_RODRIGO_B28A1 en GitHub.

name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CV_RODRIGO_B28A1 }}'
          channelId: live
          projectId: cv-rodrigo-b28a1
